<div
  class="container pt-4 pt-md-5 d-flex align-items-center justify-content-center vh-100"
>
  <div class="row d-flex justify-content-center align-items-center h-100">
    <div class="col-md-9 col-lg-6 col-xl-5">
      <img
        src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
        class="img-fluid"
        alt="Sample image"
      />
    </div>
    <main class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
      <form [formGroup]="authForm">
        <h1 class="h3 mb-3 fw-normal text-secondary">Please sign in</h1>
        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example"
            formControlName="username"
          />
          <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="passInput"
            placeholder="Password"
            formControlName="password"
            minlength="8"
            required
          />
          <label for="floatingPassword">Password</label>
        </div>

        <div class="form-check text-start my-3">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="flexCheckDefault"
            (click)="showPass()"
          />
          <label class="form-check-label text-secondary" for="flexCheckDefault">
            Show password
          </label>
        </div>
        <button
          class="btn btn-primary w-100 py-2"
          type="submit"
          (click)="connectSub()"
          [disabled]="isSubmitting && !authForm.valid"
        >
          Sign in
        </button>
        <p class="mt-5 mb-3 text-body-secondary">© 2023–2024</p>
      </form>
    </main>
  </div>
</div>
